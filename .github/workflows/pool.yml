name: pool

on:
  workflow_dispatch:

concurrency:
  group: pool
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: fetch positions
        run: |
          mkdir -p data
          curl -sL -o data/all_positions.csv \
            "https://cdn.jsdelivr.net/gh/momofutu88/quant-ref-data@main/data/all_positions.csv"
          curl -sL -o data/h3_features.csv \
            "https://cdn.jsdelivr.net/gh/momofutu88/quant-ref-data@main/data/h3_features.csv"
          wc -l data/all_positions.csv

      - name: build candidate pool
        run: python3 scripts/pool.py

      - name: publish
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
        run: python3 scripts/publish_pool.py

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-pool
          path: |
            data/candidate_pool.csv
            data/market_snapshot.csv
            data/pool_meta.json
