name: discover
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: run discovery
        run: python3 scripts/discover.py
      - uses: actions/upload-artifact@v4
        with:
          name: discovery
          path: data/discovery.txt
