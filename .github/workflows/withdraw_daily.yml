name: withdraw-daily
# 每4小时扫一次，只在「首次跨档」或「距下一档 90%」时推送（邮件 + ntfy）
on:
  schedule:
    - cron: "0 */4 * * *"    # 每4小时（UTC 0,4,8...）= 北京 08,12,16,20,00,04
  workflow_dispatch:
    inputs:
      force:
        description: "1 = 强制推送（测试用）"
        default: "0"
permissions:
  contents: write
concurrency:
  group: withdraw-daily
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
        run: |
          FORCE=""
          [ "${{ github.event.inputs.force }}" = "1" ] && FORCE="--force"
          python3 scripts/withdraw_check.py --mode instant $FORCE
      - name: commit state
        run: |
          git config user.name "tds-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && exit 0
          git commit -m "state: withdraw tier snapshot [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main && git push -q && break
            echo "push retry $i"; sleep 5
          done
