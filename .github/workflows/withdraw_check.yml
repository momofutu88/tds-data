name: withdraw-check
on:
  schedule:
    - cron: "0 12 * * 0,3"      # 每周三、周日 20:00 (UTC+8)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 scripts/withdraw_check.py
        env:
          NTFY_TOPIC: wb-tds-gc-7f3a9c1e
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
      - name: commit state
        run: |
          git config user.name "tds-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          git commit -m "state: weekly review snapshot [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main && git push -q && break
            echo "push retry $i"; sleep 5
          done
