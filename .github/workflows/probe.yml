name: probe
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: record shape
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          ID=4902752005274121217
          B="https://www.binance.com/bapi/futures/v1/friendly/future/copy-trade/lead-portfolio"
          echo "@@@ pageSize=100"
          curl -s -m 20 -X POST -H "User-Agent: $UA" -H "Content-Type: application/json" \
            -d '{"portfolioId":"'$ID'","pageNumber":1,"pageSize":100}' "$B/position-history" \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['data'];print('total',d['total'],'returned',len(d['list']));print(json.dumps(d['list'][0],ensure_ascii=False,indent=1))"
          echo "@@@ trade-history POST"
          curl -s -m 20 -X POST -H "User-Agent: $UA" -H "Content-Type: application/json" \
            -d '{"portfolioId":"'$ID'","pageNumber":1,"pageSize":5}' "$B/trade-history" \
            | head -c 1200
