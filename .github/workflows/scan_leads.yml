name: scan-leads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: scan leads
        run: python3 scripts/scan_leads.py
      - uses: actions/upload-artifact@v4
        with:
          name: leads-scan
          path: data/leads_*.csv
